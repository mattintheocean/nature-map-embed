<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nature Map Embed Test</title>
<style>
  body { margin:0; font-family:system-ui, sans-serif; color:#10331f; }
  .section { padding:80px 24px; max-width:900px; margin:0 auto; }
  .map-section { height:80vh; }
</style>
</head>
<body>
<div class="section"><h1>Page content above</h1><p>Scroll down. The map should not take over the page scroll.</p></div>

<!-- What goes in the Webflow Code Embed -->
<section class="map-section">
  <div class="nature-map" style="width:100%;height:100%">
    <div data-marker data-lat="-36.848" data-lng="174.763" hidden>
      <div class="nature-map-number">520+</div>
      <div class="nature-map-label">Community groups active across Auckland’s conservation network</div>
    </div>
    <div data-marker data-lat="-36.786" data-lng="174.860" hidden>
      <div class="nature-map-number">40+</div>
      <div class="nature-map-label">Predator-free islands in the Hauraki Gulf</div>
    </div>
    <div data-marker data-lat="-36.930" data-lng="174.600" hidden>
      <div class="nature-map-number">2030</div>
      <div class="nature-map-label">Halt and reverse nature loss</div>
    </div>
  </div>
</section>
<script src="nature-grid-embed.js" defer></script>

<div class="section"><h2>Page content below</h2><p style="height:60vh">More content.</p></div>
</body>
</html>
